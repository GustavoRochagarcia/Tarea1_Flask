{% extends "base.html" %}
{% block title %}Nuevo usuario{% endblock %}
{% block content %}
<div class="card">
    <h1>Nuevo usuario</h1>
    <form method="POST" action="{{ url_for('users.create') }}">
        <div class="form-row">
            <div class="form-group">
                <label>DNI</label>
                <input type="text" name="dni" required placeholder="Ej: 12345678">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="correo@ejemplo.com">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" name="given_name" required placeholder="Juan">
            </div>
            <div class="form-group">
                <label>Apellido</label>
                <input type="text" name="family_name" required placeholder="Pérez">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" name="phone_number" required placeholder="555-0001">
            </div>
            <div class="form-group">
                <label>Dirección</label>
                <input type="text" name="address" required placeholder="Calle Principal 123">
            </div>
        </div>
        <div class="actions" style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-success">Crear Usuario</button>
            <a href="{{ url_for('users.index') }}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
