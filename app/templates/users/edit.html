{% extends "base.html" %}
{% block title %}Editar usuario{% endblock %}
{% block content %}
<div class="card">
    <h1>Editar usuario</h1>
    <form method="POST" action="{{ url_for('users.update', id=user.id) }}">
        <div class="form-row">
            <div class="form-group">
                <label>DNI</label>
                <input type="text" name="dni" value="{{ user.dni }}" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" name="given_name" value="{{ user.given_name }}" required>
            </div>
            <div class="form-group">
                <label>Apellido</label>
                <input type="text" name="family_name" value="{{ user.family_name }}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" name="phone_number" value="{{ user.phone_number }}" required>
            </div>
            <div class="form-group">
                <label>Dirección</label>
                <input type="text" name="address" value="{{ user.address }}" required>
            </div>
        </div>
        <div class="actions" style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-success">Guardar Cambios</button>
            <a href="{{ url_for('users.show', id=user.id) }}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
